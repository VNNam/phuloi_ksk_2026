<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phiếu thông tin khám sức khỏe</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen py-8 px-4">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md p-6">
    <div class="text-center pb-4 border-b">
      <h2 class="text-xs uppercase font-bold text-gray-600">ỦY BAN NHÂN DÂN PHƯỜNG AN LẠC - TRẠM Y TẾ</h2>
      <h1 class="text-xl font-bold text-blue-900 mt-1">Phiếu thông tin khám sức khỏe năm 2026</h1>
    </div>

    <form id="healthForm" class="mt-6 space-y-4">
      <div>
        <label class="block text-sm font-semibold">Họ và tên (viết hoa) *</label>
        <input type="text" id="hoTen" required class="w-full border rounded p-2 uppercase focus:ring-2 ring-blue-400">
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold">Giới tính *</label>
          <div class="flex gap-4 mt-2">
            <label><input type="radio" name="gioiTinh" value="Nam" required> Nam</label>
            <label><input type="radio" name="gioiTinh" value="Nữ"> Nữ</label>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold">Ngày sinh *</label>
          <input type="date" id="ngaySinh" required class="w-full border rounded p-2">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-semibold">Số CCCD *</label>
          <input type="text" id="cccd" required class="w-full border rounded p-2">
        </div>
        <div>
          <label class="block text-sm font-semibold">Số điện thoại *</label>
          <input type="tel" id="soDienThoai" required class="w-full border rounded p-2">
        </div>
      </div>

      <div>
        <label class="block text-sm font-semibold">Khu phố *</label>
        <select id="khuPho" required class="w-full border rounded p-2">
          <option value="">-- Chọn khu phố --</option>
          <!-- Tự động thêm từ 1 đến 52 bằng JS -->
        </select>
      </div>

      <div>
        <label class="block text-sm font-semibold">File đính kèm (Phiếu khám/Kết quả)</label>
        <input type="file" id="fileDinhKem" accept="image/*,application/pdf" class="w-full border p-1 rounded">
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-blue-900 text-white font-bold py-3 rounded hover:bg-blue-800 transition">
        XÁC NHẬN GỬI THÔNG TIN
      </button>
    </form>
  </div>

  <script>
    // Điền nhanh danh sách khu phố
    const kpSelect = document.getElementById("khuPho");
    for (let i = 1; i <= 52; i++) {
      kpSelect.innerHTML += `<option value="Khu phố ${i}">Chi bộ / Khu phố ${i}</option>`;
    }

    const SCRIPT_URL = "THAY_BANG_GOOGLE_WEB_APP_URL";

    document.getElementById("healthForm").addEventListener("submit", async function(e) {
      e.preventDefault();
      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.innerText = "Đang gửi dữ liệu...";

      let fileBase64 = null, fileName = null;
      const fileInput = document.getElementById("fileDinhKem");
      if (fileInput.files.length > 0) {
        const file = fileInput.files[0];
        fileName = file.name;
        fileBase64 = await new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.readAsDataURL(file);
        });
      }

      const payload = {
        hoTen: document.getElementById("hoTen").value.toUpperCase(),
        gioiTinh: document.querySelector('input[name="gioiTinh"]:checked').value,
        ngaySinh: document.getElementById("ngaySinh").value,
        cccd: document.getElementById("cccd").value,
        soDienThoai: document.getElementById("soDienThoai").value,
        khuPho: document.getElementById("khuPho").value,
        fileBase64: fileBase64,
        fileName: fileName
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
        alert("Gửi thông tin thành công!");
        document.getElementById("healthForm").reset();
      } catch (err) {
        alert("Có lỗi xảy ra, vui lòng thử lại!");
      } finally {
        btn.disabled = false;
        btn.innerText = "XÁC NHẬN GỬI THÔNG TIN";
      }
    });
  </script>
</body>
</html>
